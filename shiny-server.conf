# Shiny Server configuration for the suicide statistics app

# Run as the shiny user
run_as shiny;

# Define the server
server {
  listen 3838;

  # Define the location of the app
  location / {
    # Host the app from this directory
    site_dir /srv/shiny-server/shinyappM2Proj;
    
    # Log directory
    log_dir /var/log/shiny-server;
    
    # Directory index - use app.R as entry point
    directory_index on;
  }
}
