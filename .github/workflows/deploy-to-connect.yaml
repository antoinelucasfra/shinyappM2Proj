# Deployment workflow for Posit Connect Cloud
# This workflow deploys the Shiny app to Posit Connect Cloud when pushing to main branch
# 
# Required secrets:
#   POSIT_CONNECT_API_KEY: API key from Posit Connect Cloud (generate at https://connect.posit.cloud/antoinelucasfra)
#
# Setup instructions:
#   1. Go to https://connect.posit.cloud/antoinelucasfra
#   2. Generate an API key from your account settings
#   3. Add the API key as a repository secret named POSIT_CONNECT_API_KEY
#      (Settings -> Secrets and variables -> Actions -> New repository secret)

name: Deploy to Posit Connect Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install R packages
        run: |
          Rscript -e '
            # Install rsconnect for deployment
            install.packages("rsconnect", repos = "https://cloud.r-project.org")
            
            # Install app dependencies
            packages <- c(
              "shiny",
              "shinythemes",
              "shinyWidgets",
              "shinydashboard",
              "tidyverse",
              "leaflet",
              "plotly",
              "sf",
              "mapview",
              "readxl"
            )
            install.packages(packages, repos = "https://cloud.r-project.org")
          '

      - name: Generate manifest.json
        run: |
          Rscript -e 'rsconnect::writeManifest(appDir = ".")'

      - name: Deploy to Posit Connect Cloud
        env:
          CONNECT_SERVER: https://connect.posit.cloud
          CONNECT_API_KEY: ${{ secrets.POSIT_CONNECT_API_KEY }}
        run: |
          Rscript -e "
            tryCatch({
              rsconnect::addConnectServer(
                url = Sys.getenv('CONNECT_SERVER'),
                name = 'posit-connect-cloud'
              )
              rsconnect::connectApiUser(
                server = 'posit-connect-cloud',
                apiKey = Sys.getenv('CONNECT_API_KEY'),
                account = 'antoinelucasfra'
              )
              rsconnect::deployApp(
                appDir = '.',
                appName = 'shinyappM2Proj',
                server = 'posit-connect-cloud',
                account = 'antoinelucasfra',
                forceUpdate = TRUE,
                logLevel = 'normal'
              )
              message('Deployment completed successfully')
            }, error = function(e) {
              message('Deployment failed: ', conditionMessage(e))
              quit(status = 1)
            })
          "
