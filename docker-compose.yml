version: '3.8'

services:
  shiny-app:
    build: .
    ports:
      - "3838:3838"
    # For development: uncomment the volumes section below to enable live code reloading
    # volumes:
    #   - ./:/srv/shiny-server/shinyappM2Proj
    restart: unless-stopped
    environment:
      - APPLICATION_LOGS_TO_STDOUT=true
